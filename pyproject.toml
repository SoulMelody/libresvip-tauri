[project]
name = "libresvip-tauri"
version = "2.9.2"
description = ""
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "connectrpc>=0.12.1",
    "hypercorn>=0.18.0",
    "libresvip[crypto,lxml,ujson,yaml12]>=2.9.2",
    "psutil>=7.2.2",
    "starlette>=1.7.0",
]

[dependency-groups]
nodejs = [
    "nodejs-wheel>=24.19.0",
    "pydantic-to-typescript>=2.0.0",
]
packaging = [
    "pillow>=12.3.0",
    "pyinstaller>=6.22.3",
    "shellingham<2.0.0,>=1.5.4",
    "uv>=0.13.0",
]
protobuf = [
    "buf-bin>=1.73.0",
    "protoc-gen-connectrpc>=0.12.1",
    "protoc-gen-py>=0.6.0",
]

[tool.uv.build-backend]
module-name = "libresvip_tauri"
module-root = ""

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"
